{{- /*
The credential encryption key is shared by every replica, so all of them open
the same pushes. Without forager.encPrivateKey the chart generates one on
install and keeps it across upgrades by reading it back from this Secret.
*/ -}}
{{- $encKey := .Values.forager.encPrivateKey }}
{{- if not $encKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "forager.fullname" .) }}
{{- if and $existing $existing.data (hasKey $existing.data "enc-private-key") }}
{{- $encKey = index $existing.data "enc-private-key" | b64dec }}
{{- else }}
{{- $encKey = randBytes 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forager.fullname" . }}
  labels:
    {{- include "forager.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.forager.accessKey | b64enc | quote }}
  access-secret: {{ .Values.forager.accessSecret | b64enc | quote }}
  enc-private-key: {{ $encKey | b64enc | quote }}
